<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deprem Hasar Tespiti | Web-GIS Karar Destek Paneli</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { height: 100%; width: 100%; overflow: hidden; }
    #map { height: 100vh; width: 100vw; z-index: 1; }

    .control-panel {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 16px 20px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      width: 300px;
    }

    .control-panel h2 {
      font-size: 16px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 4px;
    }

    .control-panel p.subtitle {
      font-size: 12px;
      color: #718096;
      margin-bottom: 12px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
      color: #2d3748;
    }

    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      display: inline-block;
      margin-right: 8px;
    }

    .legend-label {
      display: flex;
      align-items: center;
    }

    .stat-badge {
      font-weight: 600;
      font-size: 12px;
      background: #edf2f7;
      padding: 2px 8px;
      border-radius: 12px;
      color: #4a5568;
    }

    .status-alert {
      margin-top: 12px;
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      background: #e6fffa;
      color: #234e52;
      border: 1px solid #b2f5ea;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="control-panel">
    <h2>Deprem Hasar Analizi</h2>
    <p class="subtitle">Antakya Bölgesi — VHR Uydu Segmentasyonu</p>
    
    <div class="legend-item">
      <span class="legend-label"><span class="legend-color" style="background:#28a745;"></span>Hasarsız</span>
      <span class="stat-badge" id="count-no-damage">-</span>
    </div>
    <div class="legend-item">
      <span class="legend-label"><span class="legend-color" style="background:#ffc107;"></span>Hafif Hasar</span>
      <span class="stat-badge" id="count-minor">-</span>
    </div>
    <div class="legend-item">
      <span class="legend-label"><span class="legend-color" style="background:#fd7e14;"></span>Ağır Hasar</span>
      <span class="stat-badge" id="count-major">-</span>
    </div>
    <div class="legend-item">
      <span class="legend-label"><span class="legend-color" style="background:#dc3545;"></span>Yıkık</span>
      <span class="stat-badge" id="count-destroyed">-</span>
    </div>

    <div class="status-alert" id="data-source-status">Veri kaynağı yükleniyor...</div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
